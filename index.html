<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr.Ng的摘名系統 - 斯文音效版</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
            background-color: #f0f2f5;
            color: #333;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        h1 {
            color: #1a73e8;
            margin: 0;
            font-size: 26px;
        }
        .clear-all-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .clear-all-btn:hover {
            background-color: #bd2130;
        }
        
        .main-box {
            background: white;
            border: 2px solid #ccc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .good-box { border-left: 8px solid #28a745; }
        .bad-box { border-left: 8px solid #dc3545; }
        
        .box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .box-title {
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .good-icon { color: #28a745; }
        .bad-icon { color: #dc3545; }
        
        .add-btn {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        .add-btn:hover { background: #1557b0; }
        
        .result-display {
            font-size: 18px;
            min-height: 45px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .clickable-tag {
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s;
            display: inline-block;
            font-weight: bold;
        }
        .clickable-tag:hover {
            background-color: #ff0000 !important;
            color: white !important;
            text-decoration: line-through;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            text-align: center;
        }
        .student-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 20px 0;
            max-height: 300px;
            overflow-y: auto;
            padding: 5px;
        }
        .student-btn {
            padding: 10px 5px;
            font-size: 16px;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
        }
        .student-btn:hover { background: #e2e6ea; }
        .close-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .status-good { color: #155724; background: #d4edda; border: 1px solid #c3e6cb; }
        .status-black { color: #ffffff; background: #343a40; border: 1px solid #23272b; }
        .status-yellow { color: #856404; background: #fff3cd; border: 1px solid #ffeeba; }
        .status-red { color: #721c24; background: #f8d7da; border: 1px solid #f5c6cb; }

        .history-box {
            background: #e9ecef;
            border: 2px dashed #999;
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
        }
        .history-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        input[type="date"] {
            padding: 8px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
            width: 100%;
            box-sizing: border-box;
        }
        .history-list {
            margin-top: 10px;
            font-size: 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>📋 Mr.Ng的摘名系統</h1>
        <button class="clear-all-btn" onclick="clearTodayAll()">🧹 清空今日紀錄</button>
    </div>

    <div class="main-box good-box">
        <div class="box-header">
            <div class="box-title"><span class="good-icon">👍</span> 「乖」紀錄 (可多選)</div>
            <button class="add-btn" onclick="openModal('good')">+ 登記表現好</button>
        </div>
        <div class="result-display" id="goodDisplay"></div>
    </div>

    <div class="main-box bad-box">
        <div class="box-header">
            <div class="box-title"><span class="bad-icon">⚠️</span> 「摘名」警告紀錄 (獨立累計顏色)</div>
            <button class="add-btn" onclick="openModal('bad')">+ 登記摘名</button>
        </div>
        <div class="result-display" id="badDisplay"></div>
    </div>

    <div class="history-box">
        <div class="history-title">🔍 歷史紀錄查詢</div>
        <input type="date" id="historyDate" onchange="loadHistoryData()">
        <div>
            <strong>🚨 該日已滿 3 次警告(變紅色)的正式記名學生：</strong>
            <div id="historyDisplay" class="history-list">請選擇日子...</div>
        </div>
    </div>

    <div class="modal" id="numberModal">
        <div class="modal-content">
            <h3 id="modalTitle">請選取學號 (1-45)</h3>
            <div class="student-grid" id="studentGrid"></div>
            <button class="close-btn" onclick="closeModal()">關閉</button>
        </div>
    </div>

<script>
    var currentMode = ''; 
    var todayStr = new Date().toISOString().split('T')[0];
    var todayData = JSON.parse(localStorage.getItem('ngSystem_v2_' + todayStr)) || { good: [], bad: {} };

    var audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    // 基礎單音函數
    function playTone(frequency, type, duration, volume) {
        try {
            initAudio();
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = frequency;
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) { console.log(e); }
    }

    // 🚨 Level 1 警報：低沉雙音交替（約 3 秒，調小了音量）
    function playLevel1Alert() {
        initAudio();
        var now = audioCtx.currentTime;
        for (var i = 0; i < 4; i++) {
            var startTime = now + (i * 0.7);
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.type = 'sine'; // 改用溫和的正弦波
            osc.frequency.setValueAtTime(i % 2 === 0 ? 380 : 320, startTime);
            
            gain.gain.setValueAtTime(0.06, startTime);
            gain.gain.setValueAtTime(0.06, startTime + 0.3);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.35);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.35);
        }
    }

    // 🚨 Level 2 警報：中頻密集提示音（約 4 秒）
    function playLevel2Alert() {
        initAudio();
        var now = audioCtx.currentTime;
        for (var i = 0; i < 14; i++) {
            var startTime = now + (i * 0.28);
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.type = 'sine'; // 改用正弦波，聽起來像倒數提示音，比較不刺耳
            osc.frequency.setValueAtTime(520, startTime);
            
            gain.gain.setValueAtTime(0.08, startTime);
            gain.gain.setValueAtTime(0.08, startTime + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.12);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.12);
        }
    }

    // 🚨 Level 3 警報：優雅、嚴肅的「高低雙音叮咚」循環（持續約 4-5 秒）
    // 聽起來像高鐵或機場的正式廣播提示音，提醒全班「注意，已正式記名」
    function playLevel3Alert() {
        initAudio();
        var now = audioCtx.currentTime;
        
        // 循環播放 3 次「叮咚」➔ 每次間隔 1.3 秒，總共約 4.2 秒
        for (var i = 0; i < 3; i++) {
            var baseTime = now + (i * 1.3);
            
            // 1.「叮」高音 (550Hz)
            var oscHigh = audioCtx.createOscillator();
            var gainHigh = audioCtx.createGain();
            oscHigh.type = 'sine';
            oscHigh.frequency.setValueAtTime(550, baseTime);
            gainHigh.gain.setValueAtTime(0.12, baseTime);
            gainHigh.gain.exponentialRampToValueAtTime(0.0001, baseTime + 0.4);
            oscHigh.connect(gainHigh);
            gainHigh.connect(audioCtx.destination);
            oscHigh.start(baseTime);
            oscHigh.stop(baseTime + 0.4);
            
            // 2.「咚」低音 (440Hz)，比高音慢 0.25 秒響起
            var oscLow = audioCtx.createOscillator();
            var gainLow = audioCtx.createGain();
            oscLow.type = 'sine';
            oscLow.frequency.setValueAtTime(440, baseTime + 0.25);
            gainLow.gain.setValueAtTime(0.12, baseTime + 0.25);
            gainLow.gain.exponentialRampToValueAtTime(0.0001, baseTime + 0.25 + 0.5);
            oscLow.connect(gainLow);
            gainLow.connect(audioCtx.destination);
            oscLow.start(baseTime + 0.25);
            oscLow.stop(baseTime + 0.25 + 0.5);
        }
    }

    // 🔊 音效總控制器
    function triggerSound(mode, currentCount) {
        if (mode === 'good') {
            // 👍 「乖」音效：清脆一聲「叮！」
            playTone(880, 'sine', 0.15, 0.08);
        } else {
            // ⚠️ 「摘名」長音效階梯
            if (currentCount === 1) {
                playLevel1Alert(); // Level 1 (溫和嗶波 3秒)
            } else if (currentCount === 2) {
                playLevel2Alert(); // Level 2 (規律倒數 4秒)
            } else if (currentCount >= 3) {
                playLevel3Alert(); // Level 3 (優雅嚴肅叮咚 4.5秒)
            }
        }
    }

    window.onload = function() {
        document.getElementById('historyDate').value = todayStr;
        renderTodayDisplay();
        loadHistoryData();
    };

    function renderTodayDisplay() {
        var goodDisp = document.getElementById('goodDisplay');
        if (todayData.good.length > 0) {
            goodDisp.innerHTML = todayData.good.map(function(num, idx) {
                return '<span class="clickable-tag status-good" onclick="removeGood(' + idx + ')" title="點擊取消紀錄">' + num + ' 號</span>';
            }).join('');
        } else {
            goodDisp.innerHTML = '<span style="color:#999; font-style:italic;">今日暫無紀錄</span>';
        }

        var badDisp = document.getElementById('badDisplay');
        var badKeys = Object.keys(todayData.bad).filter(function(k) { return todayData.bad[k] > 0; });
        
        if (badKeys.length > 0) {
            badDisp.innerHTML = badKeys.map(function(num) {
                var count = todayData.bad[num];
                var colorClass = 'status-black';
                var label = '1次警告';
                
                if (count === 2) { colorClass = 'status-yellow'; label = '2次警告'; }
                if (count >= 3) { colorClass = 'status-red'; label = '最終記名'; }
                
                return '<span class="clickable-tag ' + colorClass + '" onclick="removeBad(\'' + num + '\')" title="點擊扣減一次警告">' + num + ' 號 (' + label + ')</span>';
            }).join('');
        } else {
            badDisp.innerHTML = '<span style="color:#999; font-style:italic;">今日暫無摘名紀錄</span>';
        }
    }

    function openModal(mode) {
        currentMode = mode;
        var modal = document.getElementById('numberModal');
        var title = document.getElementById('modalTitle');
        var grid = document.getElementById('studentGrid');
        grid.innerHTML = '';

        title.innerText = mode === 'good' ? "👍 請選擇「乖」的學生學號" : "⚠️ 請選擇要「摘名」的學生學號";

        for (var i = 1; i <= 45; i++) {
            var btn = document.createElement('button');
            btn.className = 'student-btn';
            
            if (mode === 'bad' && todayData.bad[i]) {
                var currentCount = todayData.bad[i];
                btn.innerText = i + '號 (' + currentCount + '次)';
                if(currentCount >= 3) btn.style.color = 'red';
            } else {
                btn.innerText = i + '號';
            }
            
            (function(id) {
                btn.onclick = function() { selectNumber(id); };
            })(i);
            
            grid.appendChild(btn);
        }
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('numberModal').style.display = 'none';
    }

    function selectNumber(num) {
        var finalCount = 0;
        if (currentMode === 'good') {
            todayData.good.push(num);
            todayData.good.sort(function(a, b) { return a - b; });
        } else {
            if (!todayData.bad[num]) {
                todayData.bad[num] = 1;
            } else {
                todayData.bad[num] += 1;
            }
            finalCount = todayData.bad[num];
        }

        // 播音核心
        triggerSound(currentMode, finalCount);

        saveToLocalStorage();
        renderTodayDisplay();
        loadHistoryData();
        closeModal();
    }

    function removeGood(idx) {
        var num = todayData.good[idx];
        if (confirm('確定要取消 ' + num + ' 號的「乖」紀錄嗎？')) {
            todayData.good.splice(idx, 1);
            playTone(200, 'sine', 0.1, 0.05);
            saveToLocalStorage();
            renderTodayDisplay();
        }
    }

    function removeBad(num) {
        var currentCount = todayData.bad[num];
        var statusStr = currentCount === 1 ? "第一次(黑色)" : currentCount === 2 ? "第二次(黃色)" : "第三次(紅色)";
        
        if (confirm('確定要取消 ' + num + ' 號的這一層 [' + statusStr + '] 摘名紀錄嗎？\n(確認後會退回上一個警告狀態)')) {
            todayData.bad[num] -= 1;
            if (todayData.bad[num] <= 0) {
                delete todayData.bad[num];
            }
            playTone(200, 'sine', 0.1, 0.05);
            saveToLocalStorage();
            renderTodayDisplay();
            loadHistoryData();
        }
    }

    function clearTodayAll() {
        if (confirm("⚠️ 確定要完全清空今天的『乖』和『摘名』紀錄嗎？\n此操作會抹除今天的所有輸入，且無法復原！")) {
            todayData = { good: [], bad: {} };
            playTone(150, 'sawtooth', 0.2, 0.1);
            saveToLocalStorage();
            renderTodayDisplay();
            loadHistoryData();
            alert("🧹 今天的紀錄已全部清空！");
        }
    }

    function saveToLocalStorage() {
        localStorage.setItem('ngSystem_v2_' + todayStr, JSON.stringify(todayData));
    }

    function loadHistoryData() {
        var targetDate = document.getElementById('historyDate').value;
        var historyDisp = document.getElementById('historyDisplay');
        
        if (!targetDate) return;

        var historyData = JSON.parse(localStorage.getItem('ngSystem_v2_' + targetDate));

        if (historyData && historyData.bad) {
            var redList = Object.keys(historyData.bad).filter(function(num) { return historyData.bad[num] >= 3; });
            
            if (redList.length > 0) {
                redList.sort(function(a, b) { return a - b; });
                historyDisp.innerHTML = redList.map(function(num) {
                    return '<span class="status-red" style="padding: 5px 12px; border-radius:6px; font-weight:bold;">🎓 ' + num + ' 號</span>';
                }).join('');
            } else {
                historyDisp.innerHTML = '<span style="color: #6c757d; font-style: italic; font-size: 16px;">該日子沒有累積滿 3 次警告(紅色)的學生</span>';
            }
        } else {
            historyDisp.innerHTML = '<span style="color: #6c757d; font-style: italic; font-size: 16px;">該日子沒有任何紀錄</span>';
        }
    }
</script>

</body>
</html>
