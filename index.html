<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr.Ng的摘名系統 - 實戰優化版</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
            background-color: #f0f2f5;
            color: #333;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        h1 {
            color: #1a73e8;
            margin: 0;
            font-size: 26px;
        }
        .clear-all-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .clear-all-btn:hover {
            background-color: #bd2130;
        }
        
        .main-box {
            background: white;
            border: 2px solid #ccc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .good-box { border-left: 8px solid #28a745; }
        .bad-box { border-left: 8px solid #dc3545; }
        
        .box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .box-title {
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .good-icon { color: #28a745; }
        .bad-icon { color: #dc3545; }
        
        .add-btn {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        .add-btn:hover { background: #1557b0; }
        
        .result-display {
            font-size: 18px;
            min-height: 45px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .clickable-tag {
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s;
            display: inline-block;
            font-weight: bold;
        }
        .clickable-tag:hover {
            background-color: #ff0000 !important;
            color: white !important;
            text-decoration: line-through;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            text-align: center;
        }
        .student-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 20px 0;
            max-height: 300px;
            overflow-y: auto;
            padding: 5px;
        }
        .student-btn {
            padding: 10px 5px;
            font-size: 16px;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
        }
        .student-btn:hover { background: #e2e6ea; }
        .close-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .status-good { color: #155724; background: #d4edda; border: 1px solid #c3e6cb; }
        .status-black { color: #ffffff; background: #343a40; border: 1px solid #23272b; }
        .status-yellow { color: #856404; background: #fff3cd; border: 1px solid #ffeeba; }
        .status-red { color: #721c24; background: #f8d7da; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <!-- 頂部標題與清空按鈕 -->
    <div class="header-container">
        <h1>📋 Mr.Ng的摘名系統</h1>
        <button class="clear-all-btn" onclick="clearTodayAll()">🧹 清空今日紀錄</button>
    </div>

    <!-- 乖 大框 -->
    <div class="main-box good-box">
        <div class="box-header">
            <div class="box-title"><span class="good-icon">👍</span> 「乖」紀錄 (可多選)</div>
            <button class="add-btn" onclick="openModal('good')">+ 登記表現好</button>
        </div>
        <div class="result-display" id="goodDisplay"></div>
    </div>

    <!-- 摘名 大框 -->
    <div class="main-box bad-box">
        <div class="box-header">
            <div class="box-title"><span class="bad-icon">⚠️</span> 「摘名」警告紀錄</div>
            <button class="add-btn" onclick="openModal('bad')">+ 登記摘名</button>
        </div>
        <div class="result-display" id="badDisplay"></div>
    </div>

    <!-- 彈出選號表 -->
    <div class="modal" id="numberModal">
        <div class="modal-content">
            <h3 id="modalTitle">請選取學號 (1-45)</h3>
            <div class="student-grid" id="studentGrid"></div>
            <button class="close-btn" onclick="closeModal()">關閉</button>
        </div>
    </div>

<script>
    var currentMode = ''; 
    var todayStr = new Date().toISOString().split('T')[0];
    // 為了安全相容舊資料結構，若發現舊的 good 是陣列，自動初始化為物件
    var rawData = JSON.parse(localStorage.getItem('ngSystem_v3_' + todayStr));
    if (!rawData || Array.isArray(rawData.good)) {
        rawData = { good: {}, bad: {} };
    }
    var todayData = rawData;

    var audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    // 基礎單音函數
    function playTone(frequency, type, duration, volume) {
        try {
            initAudio();
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = frequency;
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) { console.log(e); }
    }

    // 🚨 Level 1 警報：低沉雙音交替（持續約 3 秒）
    function playLevel1Alert() {
        initAudio();
        var now = audioCtx.currentTime;
        for (var i = 0; i < 4; i++) {
            var startTime = now + (i * 0.7);
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.type = 'sawtooth'; 
            osc.frequency.setValueAtTime(i % 2 === 0 ? 400 : 340, startTime);
            
            gain.gain.setValueAtTime(0.08, startTime);
            gain.gain.setValueAtTime(0.08, startTime + 0.35);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.4);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.4);
        }
    }

    // 🚨 Level 2 警報：高頻密集機槍音（持續約 4 秒）
    function playLevel2Alert() {
        initAudio();
        var now = audioCtx.currentTime;
        for (var i = 0; i < 18; i++) {
            var startTime = now + (i * 0.22);
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.type = 'triangle'; 
            osc.frequency.setValueAtTime(620, startTime);
            
            gain.gain.setValueAtTime(0.12, startTime);
            gain.gain.setValueAtTime(0.12, startTime + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.12);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.12);
        }
    }

    // 🚨 Level 3 起 警報：斯文、正式的「叮咚雙音廣播」循環（持續約 4-5 秒）
    function playLevel3Alert() {
        initAudio();
        var now = audioCtx.currentTime;
        for (var i = 0; i < 3; i++) {
            var baseTime = now + (i * 1.3);
            
            var oscHigh = audioCtx.createOscillator();
            var gainHigh = audioCtx.createGain();
            oscHigh.type = 'sine';
            oscHigh.frequency.setValueAtTime(550, baseTime);
            gainHigh.gain.setValueAtTime(0.12, baseTime);
            gainHigh.gain.exponentialRampToValueAtTime(0.0001, baseTime + 0.4);
            oscHigh.connect(gainHigh);
            gainHigh.connect(audioCtx.destination);
            oscHigh.start(baseTime);
            oscHigh.stop(baseTime + 0.4);
            
            var oscLow = audioCtx.createOscillator();
            var gainLow = audioCtx.createGain();
            oscLow.type = 'sine';
            oscLow.frequency.setValueAtTime(440, baseTime + 0.25);
            gainLow.gain.setValueAtTime(0.12, baseTime + 0.25);
            gainLow.gain.exponentialRampToValueAtTime(0.0001, baseTime + 0.25 + 0.5);
            oscLow.connect(gainLow);
            gainLow.connect(audioCtx.destination);
            oscLow.start(baseTime + 0.25);
            oscLow.stop(baseTime + 0.25 + 0.5);
        }
    }

    // 🔊 音效控制器
    function triggerSound(mode, currentCount) {
        if (mode === 'good') {
            playTone(880, 'sine', 0.18, 0.12);
        } else {
            if (currentCount === 1) {
                playLevel1Alert();
            } else if (currentCount === 2) {
                playLevel2Alert();
            } else if (currentCount >= 3) {
                playLevel3Alert(); // 3次以上全都是叮咚廣播音
            }
        }
    }

    window.onload = function() {
        renderTodayDisplay();
    };

    function renderTodayDisplay() {
        // 1. 渲染「乖」看板
        var goodDisp = document.getElementById('goodDisplay');
        var goodKeys = Object.keys(todayData.good).filter(function(k) { return todayData.good[k] > 0; });
        
        if (goodKeys.length > 0) {
            goodKeys.sort(function(a, b) { return a - b; });
            goodDisp.innerHTML = goodKeys.map(function(num) {
                var count = todayData.good[num];
                var countLabel = count > 1 ? ' (' + count + '次)' : '';
                return '<span class="clickable-tag status-good" onclick="removeGood(\'' + num + '\')" title="點擊扣減一次">' + num + ' 號' + countLabel + '</span>';
            }).join('');
        } else {
            goodDisp.innerHTML = '<span style="color:#999; font-style:italic;">今日暫無紀錄</span>';
        }

        // 2. 渲染「摘名」看板
        var badDisp = document.getElementById('badDisplay');
        var badKeys = Object.keys(todayData.bad).filter(function(k) { return todayData.bad[k] > 0; });
        
        if (badKeys.length > 0) {
            badKeys.sort(function(a, b) { return a - b; });
            badDisp.innerHTML = badKeys.map(function(num) {
                var count = todayData.bad[num];
                var colorClass = 'status-black';
                var label = '1次警告';
                
                if (count === 2) { 
                    colorClass = 'status-yellow'; 
                    label = '2次警告'; 
                } else if (count >= 3) { 
                    colorClass = 'status-red'; 
                    label = '正式摘名 ' + (count - 2) + '次'; 
                }
                
                return '<span class="clickable-tag ' + colorClass + '" onclick="removeBad(\'' + num + '\')" title="點擊扣減一次警告">' + num + ' 號 (' + label + ')</span>';
            }).join('');
        } else {
            badDisp.innerHTML = '<span style="color:#999; font-style:italic;">今日暫無摘名紀錄</span>';
        }
    }

    function openModal(mode) {
        currentMode = mode;
        var modal = document.getElementById('numberModal');
        var title = document.getElementById('modalTitle');
        var grid = document.getElementById('studentGrid');
        grid.innerHTML = '';

        title.innerText = mode === 'good' ? "👍 請選擇「乖」的學生學號" : "⚠️ 請選擇要「摘名」的學生學號";

        for (var i = 1; i <= 45; i++) {
            var btn = document.createElement('button');
            btn.className = 'student-btn';
            
            if (mode === 'good' && todayData.good[i]) {
                btn.innerText = i + '號 (' + todayData.good[i] + '次)';
                btn.style.color = 'green';
            } else if (mode === 'bad' && todayData.bad[i]) {
                var currentCount = todayData.bad[i];
                if (currentCount === 1) btn.innerText = i + '號 (1次)';
                if (currentCount === 2) btn.innerText = i + '號 (2次)';
                if (currentCount >= 3) {
                    btn.innerText = i + '號 (摘' + (currentCount - 2) + '次)';
                    btn.style.color = 'red';
                }
            } else {
                btn.innerText = i + '號';
            }
            
            (function(id) {
                btn.onclick = function() { selectNumber(id); };
            })(i);
            
            grid.appendChild(btn);
        }
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('numberModal').style.display = 'none';
    }

    function selectNumber(num) {
        var finalCount = 0;
        if (currentMode === 'good') {
            if (!todayData.good[num]) {
                todayData.good[num] = 1;
            } else {
                todayData.good[num] += 1;
            }
            finalCount = todayData.good[num];
        } else {
            if (!todayData.bad[num]) {
                todayData.bad[num] = 1;
            } else {
                todayData.bad[num] += 1;
            }
            finalCount = todayData.bad[num];
        }

        triggerSound(currentMode, finalCount);
        saveToLocalStorage();
        renderTodayDisplay();
        closeModal();
    }

    function removeGood(num) {
        var currentCount = todayData.good[num];
        if (confirm('確定要取消 ' + num + ' 號的一層「乖」紀錄嗎？')) {
            todayData.good[num] -= 1;
            if (todayData.good[num] <= 0) {
                delete todayData.good[num];
            }
            playTone(200, 'sine', 0.1, 0.05);
            saveToLocalStorage();
            renderTodayDisplay();
        }
    }

    function removeBad(num) {
        var currentCount = todayData.bad[num];
        var statusStr = currentCount === 1 ? "1次警告" : currentCount === 2 ? "2次警告" : "正式摘名 " + (currentCount - 2) + "次";
        
        if (confirm('確定要扣減 ' + num + ' 號的 [' + statusStr + '] 紀錄嗎？\n(確認後會退回上一層狀態)')) {
            todayData.bad[num] -= 1;
            if (todayData.bad[num] <= 0) {
                delete todayData.bad[num];
            }
            playTone(200, 'sine', 0.1, 0.05);
            saveToLocalStorage();
            renderTodayDisplay();
        }
    }

    function clearTodayAll() {
        if (confirm("⚠️ 確定要完全清空今天的『乖』和『摘名』紀錄嗎？\n此操作會抹除所有數據，且無法復原！")) {
            todayData = { good: {}, bad: {} };
            playTone(150, 'sawtooth', 0.2, 0.1);
            saveToLocalStorage();
            renderTodayDisplay();
            alert("🧹 今天的紀錄已全部清空！");
        }
    }

    function saveToLocalStorage() {
        localStorage.setItem('ngSystem_v3_' + todayStr, JSON.stringify(todayData));
    }
</script>

</body>
</html>
