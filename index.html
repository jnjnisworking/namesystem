<script>
    let audioCtx = null;

    // 核心發聲函數：用程式碼動態產生音效
    function playTone(frequency, type, duration) {
        try {
            // 瀏覽器安全限制：必須等使用者有互動（點擊）後才能啟動音訊
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = type; // 'sine', 'square', 'sawtooth', 'triangle'
            oscillator.frequency.value = frequency; // 音調高低 (Hz)
            
            // 漸暗效果，讓聲音聽起來比較自然舒服
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        } catch (e) {
            console.log("暫不支援音訊自動播放");
        }
    }

    // 1. 點擊學號方塊的輕快「嗶」聲
    function playClickSound() {
        playTone(600, 'sine', 0.08); 
    }

    // 2. 彈出未交名單時的「噔噔」警示音
    function playAlertSound() {
        playTone(300, 'triangle', 0.15);
        setTimeout(() => {
            playTone(220, 'triangle', 0.25);
        }, 120);
    }

    // 網頁載入時，動態產生 1 到 38 號的大按鈕
    window.onload = function() {
        const grid = document.getElementById('checkboxGrid');
        for (let i = 1; i <= 38; i++) {
            const item = document.createElement('div');
            item.className = 'student-item';
            item.innerHTML = `
                <input type="checkbox" id="student_${i}" value="${i}" onchange="playClickSound()">
                <label for="student_${i}" class="student-label">${i} 號</label>
            `;
            grid.appendChild(item);
        }
    };

    // 🔍 Count 按鈕
    function countUnchecked() {
        let uncheckedNumbers = [];
        for (let i = 1; i <= 38; i++) {
            const cb = document.getElementById(`student_${i}`);
            if (cb && !cb.checked) {
                uncheckedNumbers.push(i + "號");
            }
        }

        const alertModal = document.getElementById('customAlert');
        const displayZone = document.getElementById('unsubmittedDisplay');

        if (uncheckedNumbers.length === 0) {
            displayZone.innerHTML = "🎉 全班已齊交！";
            displayZone.style.color = "green";
            displayZone.style.background = "#e6fffa";
            displayZone.style.borderColor = "#b2f5ea";
            playTone(880, 'sine', 0.1); // 齊交時播一個高音「叮」
        } else {
            displayZone.innerHTML = uncheckedNumbers.join(', ');
            displayZone.style.color = "#c92a2a";
            displayZone.style.background = "#fff5f5";
            displayZone.style.borderColor = "#fab6b6";
            playAlertSound(); // 播放警示音
        }

        alertModal.style.display = 'flex';
    }

    // 關閉紅色彈窗
    function closeAlert() {
        document.getElementById('customAlert').style.display = 'none';
        playTone(400, 'sine', 0.05); // 關閉時輕響一下
    }

    // 🔄 Reset 按鈕
    function resetAll() {
        if (confirm("確定要重設所有格子，將它們變回未勾選狀態嗎？")) {
            for (let i = 1; i <= 38; i++) {
                const cb = document.getElementById(`student_${i}`);
                if (cb) cb.checked = false;
            }
            playTone(150, 'sawtooth', 0.2); // 重設時發出一個低沉的「刷——」聲
        }
    }
</script>
